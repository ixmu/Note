# wstunnel 虚拟主机配置 —— 形态 B：容器只跑明文 ws，TLS 由主机 nginx 终结
# 基准：nginx/1.26.3（本机真机实测，README §7.12）+ wstunnel v11.1.0
#
# 落地（Debian/Ubuntu 布局）：
#   install -Dm644 nginx/tunnel.example.com.conf /etc/nginx/sites-available/tunnel.example.com.conf
#   ln -s ../sites-available/tunnel.example.com.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   RHEL/openEuler 没有 sites-* 目录：整体放到 /etc/nginx/conf.d/wstunnel.conf 即可（同一份内容）
#
# 部署本文件前后要配套改的两处（否则一律 400/404，见 README §3.8 四条前提）：
#   1. 服务端单元：子命令 wss:// → ws://[::]:55443，删掉 --tls-certificate/--tls-private-key，
#      端口发布收回回环 -p 127.0.0.1:55443:55443（见 container-wstunnel-server.service）
#   2. 客户端单元：URL 去掉端口 → wss://tunnel.example.com（见 container-wstunnel-client.service）
#   防火墙随之变化：放行 443/tcp，55443 不再对外（只监听 127.0.0.1）
#
# 部署前替换：tunnel.example.com（域名）、/cdn-socket-stream/（= 客户端 -P 的前缀，必须一字对齐）、
#            证书路径（certbot 用 live/，acme.sh 用 /etc/nginx/ssl/<域名>/）、/var/www/tunnel.example.com（真站根）

# ── http{} 层 ────────────────────────────────────────────────────────────────
# 本文件被 include 进 http 上下文，所以 map 可以直接写在这里。
# ⚠ 同机多份此类文件会报 "duplicate map"，全站保留一处即可。
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# 自定义日志格式。**故意不打 $http_authorization**：形态 B 里 nginx 就是 TLS 终结点，
# 暗号2（Basic）与暗号1（路径前缀）在它眼里都是明文，记进日志 = 暗号落盘（README §1、实测 #61）。
# 排查鉴权时可以临时加 '$http_authorization'，用完删掉并清理已落盘的日志。
log_format wstunnel_ws '$remote_addr - [$time_local] "$request" '
                       'status=$status upstream=$upstream_status proto=$server_protocol '
                       'http2=$http2 upgrade="$http_upgrade" '
                       'rt=$request_time ua="$http_user_agent"';

# ── 80：ACME 校验 + 跳转（已有 default_server 时这段不抢默认站点）─────────────
server {
    listen      80;
    listen      [::]:80;
    server_name tunnel.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

# ── 443：真站与隧道共用一个端口（探测 `/` 得 200 真页，这就是形态 B 的全部意义）──
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;                       # nginx ≥1.25.1 的新写法；旧版改成 listen 443 ssl http2;
    server_name tunnel.example.com;

    ssl_certificate     /etc/letsencrypt/live/tunnel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    access_log /var/log/nginx/tunnel.example.com.access.log wstunnel_ws;
    error_log  /var/log/nginx/tunnel.example.com.error.log  warn;

    # 真站（形态 B 必须真有个站，否则伪装只剩个 404 页）
    root  /var/www/tunnel.example.com;
    index index.html;
    location / { try_files $uri $uri/ =404; }

    # 上游错误页统一换成站点自己的 404 页。**写在 server 层**（location 级只对该 location 生效，
    # 实测：只写在隧道 location 里时，/nope 返回 nginx 内置 404 页、/cdn-socket-stream/events 返回
    # 站点 404.html，两者不同形，反而新增特征）。两档任选其一（实测 #60）：
    error_page 400 404 502 /404.html;          # 档 1（默认启用）：只换 body，隧道那条路径状态码仍是 400
    # 档 2（探测面归零）：连状态码一起变成 404，与 /nope 完全同形。两行都要写 —— error_page 是整条覆盖式的，
    #   只留下面这行会把真站自己的 404 又交回 nginx 内置页，两个页面反而不同形（实测 §7.12 B1/B2）：
    #   error_page 404      /404.html;
    #   error_page 400 =404 /404.html;
    # location = /404.html { internal; }       # 可选：顺手把 404 页本身也从索引里摘掉

    # ── wstunnel 隧道入口 ──
    # location 必须等于客户端 -P 的前缀 + "/"（多段前缀 -P a/b/c → location /a/b/c/）。
    # 不对齐时 nginx 用自家站点应答，客户端看到的是 Invalid status code: 404 而不是 400，极易查错方向（实测 #63）。
    location /cdn-socket-stream/ {
        proxy_pass http://127.0.0.1:55443;         # ⚠ 结尾不能带 URI：多个 "/" 会把前缀剥成 /events（实测 #56）
                                                   #   想要 IPv6 回环：单元补 -p [::1]:55443:55443，这里改 http://[::1]:55443
        proxy_http_version 1.1;                    # ⚠ 缺它必失败：nginx 默认按 1.0 出上游，不转发 Upgrade/Connection（实测 #65）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # wstunnel 会解析并写进 forwarded_for=（实测 #59）
        # ⚠ 别在这里 proxy_set_header Authorization ""，那等于自废暗号2

        proxy_read_timeout 1h;                     # 默认 60s 会掐空闲隧道；实测超时值才是决定量，心跳只是兜底（实测 #57）
        proxy_send_timeout 1h;
        proxy_buffering off;                       # 长连接双向字节流，别缓冲（2 MiB 完整性实测通过）

        # 只有这一条需要留在 location 里：让 nginx 接管上游（wstunnel）生成的错误响应，
        # 上面的 error_page 才有机会替换它。上游对不带升级头的请求固定回 400 + body
        # "Invalid protocol request"（24 字节），这是默认配置下唯一的文案泄露点（实测 A3）。
        proxy_intercept_errors on;
    }
}
